version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: thespeeddevproject-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: myapp
    volumes:
      - mongodb_data:/data/db
    networks:
      - thespeeddevproject-network

  redis:
    image: redis:7.2-alpine
    container_name: thespeeddevproject-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - thespeeddevproject-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thespeeddevproject-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_DEBUG=True
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
    networks:
      - thespeeddevproject-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thespeeddevproject-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - thespeeddevproject-network

volumes:
  mongodb_data:
  redis_data:

networks:
  thespeeddevproject-network:
    driver: bridge
